name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Docker in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec -w /opt/stacks/monitoring circuit-monitoring docker compose ps --status running --services | sort | tr "\n" " " | grep -qx "cadvisor grafana prometheus "
      # Logs in with the configured password, then asks Prometheus through
      # Grafana, so one passing query proves the password, the data source,
      # the stack's network and the scrape of node_exporter on the host.
      - name: Log in to Grafana and read a scraped metric through it
        working-directory: examples/local
        run: |
          ip=$(sudo podman inspect -f '{{.NetworkSettings.IPAddress}}' circuit-monitoring)
          grafana="http://$ip:3000"
          check() {
            curl -fsS --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 -u admin:change-me-locally "$grafana/api/org" >/dev/null
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u admin:wrong "$grafana/api/org")" = 401 ]
            uid=$(curl -fsS -u admin:change-me-locally "$grafana/api/datasources/name/Prometheus" | jq -er .uid)
            for _ in $(seq 30); do
              value=$(curl -fsS -u admin:change-me-locally -G "$grafana/api/datasources/proxy/uid/$uid/api/v1/query" --data-urlencode 'query=up{job="node"}' | jq -r '.data.result[0].value[1]') && [ "$value" = 1 ] && return 0
              sleep 5
            done
            echo "Prometheus never scraped node_exporter: up is $value" >&2
            return 1
          }
          check
          if grep -q change-me-locally terraform.tfstate; then echo "the Grafana password is in state" >&2; exit 1; fi
          sudo podman exec circuit-monitoring systemctl restart docker
          check
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

